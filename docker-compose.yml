services:

  backend:
    build:
      context: ./BasicNodeSet-up-Part3-main

    env_file:
      - ./BasicNodeSet-up-Part3-main/.env

    ports:
      - "8080:8080"

    networks:
      - dtp-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/api/v1/healthCheck/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./YourAIChat-main

    ports:
      - "5173:80"

    networks:
      - dtp-network

    depends_on:
      backend:
        condition: service_healthy


networks:

  dtp-network: